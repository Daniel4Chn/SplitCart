name: SplitCart checks
on: [push, pull_request]
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: splitcart
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: splitcart
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U splitcart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://splitcart:synthetic-ci-only@127.0.0.1:55432/splitcart
      SPLITCART_DEV_AUTH: '1'
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: synthetic-ci-only-never-deploy
      PLAYWRIGHT_BROWSERS_PATH: .data/playwright
      SPLITCART_STORAGE_DIR: .data/images
      SPLITCART_PYTHON: .venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.18.0', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng postgresql-client
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r python/requirements.txt
      - run: npm run db:migrate && npm run typecheck && npm test && npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env: {SPLITCART_DEV_AUTH: '0'}
# This workflow has not run on a remote runner; local executed checks are documented separately.
